<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube検索 - Higo-Pella Portal</title>
  <link rel="stylesheet" href="../src/css/common.css">
  <link rel="stylesheet" href="../src/css/searchYT.css">
</head>
<body>

  <main class="container">
    <div class="card">
      <div class="filter-group">
        <select id="select-playlist" class="form-control playlist-control" onchange="loadVideos()">
          <option value="ALL">すべての動画</option>
        </select>
        <input type="text" id="input-search" class="form-control video-search-control" placeholder="タイトル検索" oninput="filterVideos()">
        <button type="button" class="btn btn-primary" id="btn-refresh" onclick="loadPlaylists()">更新</button>
      </div>

      <div class="tab-nav">
        <button type="button" class="tab-btn active" id="tab-all" onclick="setVideoType('ALL')">すべて</button>
        <button type="button" class="tab-btn" id="tab-regular" onclick="setVideoType('REGULAR')">通常動画</button>
        <button type="button" class="tab-btn" id="tab-shorts" onclick="setVideoType('SHORTS')">Shorts</button>
      </div>

      <div id="video-list" class="video-grid">
        <div class="video-message">動画を読み込み中...</div>
      </div>
    </div>
  </main>

  <script src="../src/js/ui.js"></script>
  <script src="../src/js/api.js"></script>
  <script src="../src/js/auth.js"></script>
  <script src="../src/js/menu.js"></script>
  <script src="../src/js/searchYT.js"></script>
</body>
</html>
