<div class="schedule-toolbar">
  <button type="button" class="schedule-today-btn" data-schedule-action="today">今日</button>
  <div class="schedule-view-controls" aria-label="カレンダー表示">
    <button type="button" class="schedule-view-btn schedule-view-tab" data-schedule-view="day">日</button>
    <button type="button" class="schedule-view-btn schedule-view-tab active" data-schedule-view="week">週</button>
    <button type="button" class="schedule-view-btn schedule-view-tab" data-schedule-view="month">月</button>
  </div>
  <div class="schedule-navigation">
    <button type="button" class="schedule-nav-btn" data-schedule-action="prev" aria-label="前の期間">‹</button>
    <span class="schedule-period-label" data-schedule-period></span>
    <button type="button" class="schedule-nav-btn" data-schedule-action="next" aria-label="次の期間">›</button>
  </div>
  <span class="schedule-cache-status" data-schedule-cache-status aria-live="polite"></span>
  <a class="schedule-booking-link" href="#" aria-label="予約画面へ">+</a>
</div>
<div class="schedule-calendar" data-schedule-container>
  <div class="schedule-message">読み込み中...</div>
</div>
<nav class="schedule-view-tabs" aria-label="カレンダー表示">
  <button type="button" class="schedule-view-tab" data-schedule-view="day">日</button>
  <button type="button" class="schedule-view-tab active" data-schedule-view="week">週</button>
  <button type="button" class="schedule-view-tab" data-schedule-view="month">月</button>
</nav>
