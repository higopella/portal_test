<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>練習予約 - Higo-Pella Portal</title>
  <link rel="icon" type="image/png" href="../src/icon.png">
  <link rel="apple-touch-icon" href="../src/icon.png">
  <link rel="stylesheet" href="../src/css/common.css">
  <link rel="stylesheet" href="../src/css/booking.css">
</head>
<body>

  <main class="container">
    <div class="card">
      <div class="tab-nav">
        <button type="button" class="tab-btn active" id="tab-btn-create" onclick="switchTab('create')">新規</button>
        <button type="button" class="tab-btn" id="tab-btn-search" onclick="switchTab('search')">検索・削除</button>
      </div>

      <!-- 新規予約 -->
      <section id="panel-create">
        <form id="form-booking" onsubmit="event.preventDefault(); handleAddBooking();">
          <div class="form-group">
            <label class="form-label" for="book-date">練習日</label>
            <input type="date" id="book-date" class="form-control" required onchange="updateEndTimePreview()">
          </div>

          <div class="form-group">
            <label class="form-label" for="book-room">練習場所</label>
            <select id="book-room" class="form-control" required>
              <option value="①">練習場所 ①</option>
              <option value="②">練習場所 ②</option>
              <option value="③">練習場所 ③</option>
            </select>
          </div>

          <div class="booking-time-grid">
            <div class="form-group">
              <label class="form-label" for="book-start-time">開始時刻</label>
              <input type="time" id="book-start-time" class="form-control" required onchange="updateEndTimePreview()">
            </div>
            <div class="form-group">
              <label class="form-label" for="book-duration">利用分数</label>
              <select id="book-duration" class="form-control" required onchange="updateEndTimePreview()">
                <option value="30">30分</option>
                <option value="60" selected>60分</option>
                <option value="90">90分</option>
                <option value="120">120分</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <span class="form-label">終了予定時刻</span>
            <div id="end-time-preview" class="end-time-preview">開始時刻を選択してください</div>
          </div>

          <div class="form-group">
            <label class="form-label" for="book-band-name">バンド名</label>
            <input type="text" id="book-band-name" class="form-control" placeholder="例: ひごペラーズ" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="book-rep-name">代表者名</label>
            <input type="text" id="book-rep-name" class="form-control" placeholder="例: 松永" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="book-transfer">譲ります情報</label>
            <select id="book-transfer" class="form-control">
              <option value="">なし</option>
              <option value="譲り可">譲り可</option>
              <option value="譲り希望">譲り希望</option>
            </select>
          </div>

          <!-- スマホ対応のフルワイド予約ボタン -->
          <button type="submit" id="btn-submit-booking" class="btn btn-primary full-width-booking-button">予約</button>
        </form>
      </section>

      <!-- 検索・削除 -->
      <section id="panel-search" class="search-panel-hidden">
        <form id="form-search" class="search-form" onsubmit="event.preventDefault(); handleSearch();">
          <div class="form-group">
            <label class="form-label" for="search-date">練習日</label>
            <input type="date" id="search-date" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-label" for="search-band-name">バンド名</label>
            <input type="text" id="search-band-name" class="form-control" placeholder="バンド名で絞り込み">
          </div>
          <button type="submit" id="btn-search-booking" class="btn btn-primary full-width-search-button">検索</button>
        </form>

        <div id="search-results"></div>
      </section>
    </div>

    <!-- カレンダー -->
    <div class="card">
      <h3 class="calendar-heading">予約カレンダー</h3>
      <div class="table-responsive">
        <iframe class="calendar-frame" src="https://calendar.google.com/calendar/embed?src=a18eeaccc3fb519de5b4b3492df6b26232f7967ab4582a2cd4d314600aa03186%40group.calendar.google.com&ctz=Asia%2FTokyo" frameborder="0" scrolling="no"></iframe>
      </div>
    </div>
  </main>

  <script src="../src/js/ui.js"></script>
  <script src="../src/js/api.js"></script>
  <script src="../src/js/auth.js"></script>
  <script src="../src/js/menu.js"></script>
  <script src="../src/js/booking.js"></script>
</body>
</html>
