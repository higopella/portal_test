<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>練習予約 - Higo-Pella Portal</title>
  <link rel="icon" type="image/png" href="../src/icon.png">
  <link rel="apple-touch-icon" href="../src/icon.png">
  <link rel="stylesheet" href="../src/common.css">
  <style>
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-sizing: border-box;
    }
    .card {
      background-color: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .tab-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab-btn {
      height: 44px;
      background-color: var(--bg);
      border: 1px solid var(--border);
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--text-sub);
      cursor: pointer;
      border-radius: var(--radius);
      touch-action: manipulation;
    }
    .tab-btn.active {
      background-color: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary-dark);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .form-label {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--text);
    }
    .form-control {
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
      outline: none;
      background-color: #ffffff;
      box-sizing: border-box;
    }
    .form-control:focus {
      border-color: var(--primary);
    }
    .end-time-preview {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--primary-dark);
      background-color: var(--primary-light);
      padding: 10px 14px;
      border-radius: var(--radius);
      display: block;
      text-align: center;
    }
    .event-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      background-color: var(--bg);
    }
    .event-title { font-weight: bold; color: var(--text); }
    .event-time { font-size: 0.85rem; color: var(--text-sub); }
  </style>
</head>
<body>

  <main class="container">
    <div class="card">
      <div class="tab-nav">
        <button type="button" class="tab-btn active" id="tab-btn-create" onclick="switchTab('create')">新規</button>
        <button type="button" class="tab-btn" id="tab-btn-search" onclick="switchTab('search')">検索・削除</button>
      </div>

      <!-- 新規予約 -->
      <section id="panel-create">
        <form id="form-booking" onsubmit="event.preventDefault(); handleAddBooking();">
          <div class="form-group">
            <label class="form-label" for="book-date">練習日</label>
            <input type="date" id="book-date" class="form-control" required onchange="updateEndTimePreview()">
          </div>

          <div class="form-group">
            <label class="form-label" for="book-room">練習場所</label>
            <select id="book-room" class="form-control" required>
              <option value="①">練習場所 ①</option>
              <option value="②">練習場所 ②</option>
              <option value="③">練習場所 ③</option>
            </select>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
              <label class="form-label" for="book-start-time">開始時刻</label>
              <input type="time" id="book-start-time" class="form-control" required onchange="updateEndTimePreview()">
            </div>
            <div class="form-group">
              <label class="form-label" for="book-duration">利用分数</label>
              <select id="book-duration" class="form-control" required onchange="updateEndTimePreview()">
                <option value="30">30分</option>
                <option value="60" selected>60分</option>
                <option value="90">90分</option>
                <option value="120">120分</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <span class="form-label">終了予定時刻</span>
            <div id="end-time-preview" class="end-time-preview">開始時刻を選択してください</div>
          </div>

          <div class="form-group">
            <label class="form-label" for="book-band-name">バンド名</label>
            <input type="text" id="book-band-name" class="form-control" placeholder="例: ひごペラーズ" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="book-rep-name">代表者名</label>
            <input type="text" id="book-rep-name" class="form-control" placeholder="例: 松永" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="book-transfer">譲ります情報</label>
            <select id="book-transfer" class="form-control">
              <option value="">なし</option>
              <option value="譲り可">譲り可</option>
              <option value="譲り希望">譲り希望</option>
            </select>
          </div>

          <!-- スマホ対応のフルワイド予約ボタン -->
          <button type="submit" id="btn-submit-booking" class="btn btn-primary" style="width: 100%; margin-top: 8px;">予約</button>
        </form>
      </section>

      <!-- 検索・削除 -->
      <section id="panel-search" style="display: none;">
        <form id="form-search" onsubmit="event.preventDefault(); handleSearch();" style="margin-bottom: 20px;">
          <div class="form-group">
            <label class="form-label" for="search-date">練習日</label>
            <input type="date" id="search-date" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-label" for="search-band-name">バンド名</label>
            <input type="text" id="search-band-name" class="form-control" placeholder="バンド名で絞り込み">
          </div>
          <button type="submit" id="btn-search-booking" class="btn btn-primary" style="width: 100%;">検索</button>
        </form>

        <div id="search-results"></div>
      </section>
    </div>

    <!-- カレンダー -->
    <div class="card">
      <h3 style="margin-bottom: 12px; font-size: 1rem; color: var(--primary-dark);">予約カレンダー</h3>
      <div class="table-responsive">
        <iframe src="https://calendar.google.com/calendar/embed?src=a18eeaccc3fb519de5b4b3492df6b26232f7967ab4582a2cd4d314600aa03186%40group.calendar.google.com&ctz=Asia%2FTokyo" style="border: 0; width: 100%; min-width: 650px; height: 500px;" frameborder="0" scrolling="no"></iframe>
      </div>
    </div>
  </main>

  <script src="../src/menu.js"></script>
  <script>
    initCommonLayout('booking');

    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('book-date').value = today;
      updateEndTimePreview();
    });

    function switchTab(tabKey) {
      const isCreate = tabKey === 'create';
      document.getElementById('panel-create').style.display = isCreate ? 'block' : 'none';
      document.getElementById('panel-search').style.display = isCreate ? 'none' : 'block';
      document.getElementById('tab-btn-create').classList.toggle('active', isCreate);
      document.getElementById('tab-btn-search').classList.toggle('active', !isCreate);
    }

    function updateEndTimePreview() {
      const timeVal = document.getElementById('book-start-time').value;
      const durationVal = parseInt(document.getElementById('book-duration').value, 10);
      const previewEl = document.getElementById('end-time-preview');

      if (!timeVal) {
        previewEl.textContent = '開始時刻を選択してください';
        return;
      }

      const [h, m] = timeVal.split(':').map(Number);
      const startDate = new Date();
      startDate.setHours(h, m, 0, 0);

      const endDate = new Date(startDate.getTime() + durationVal * 60000);
      const endHours = String(endDate.getHours()).padStart(2, '0');
      const endMinutes = String(endDate.getMinutes()).padStart(2, '0');

      previewEl.textContent = `終了予定: ${endHours}:${endMinutes}`;
    }

    async function handleAddBooking() {
      const date = document.getElementById('book-date').value;
      const room = document.getElementById('book-room').value;
      const startTime = document.getElementById('book-start-time').value;
      const duration = parseInt(document.getElementById('book-duration').value, 10);
      const bandName = document.getElementById('book-band-name').value.trim();
      const repName = document.getElementById('book-rep-name').value.trim();
      const transferStatus = document.getElementById('book-transfer').value;
      const btn = document.getElementById('btn-submit-booking');

      const startDateTime = new Date(`${date.replace(/-/g, '/')} ${startTime}:00`);
      const now = new Date();
      if (startDateTime <= now) {
        showToast('過去の日時は予約できません', 'error');
        return;
      }

      const maxDate = new Date();
      maxDate.setMonth(maxDate.getMonth() + 1);
      maxDate.setHours(23, 59, 59, 999);
      if (startDateTime > maxDate) {
        showToast('1ヶ月より先の予約はできません', 'error');
        return;
      }

      const endDateTime = new Date(startDateTime.getTime() + duration * 60000);
      const limit18 = new Date(startDateTime);
      limit18.setHours(18, 0, 0, 0);
      if (endDateTime > limit18 && duration > 90) {
        showToast('18:00を超える予約は最大90分までです', 'error');
        return;
      }

      const payloadData = { date, room, startTime, duration, bandName, repName, transferStatus };

      await withButtonLoading(btn, async () => {
        const res = await callGasApi('addEventToCalendar', payloadData);
        if (res.success) {
          showToast('予約が完了しました');
          document.getElementById('form-booking').reset();
          document.getElementById('book-date').value = new Date().toISOString().split('T')[0];
          updateEndTimePreview();
        } else {
          showToast(res.error || '予約に失敗しました', 'error');
        }
      }, '予約中...');
    }

    async function handleSearch() {
      const date = document.getElementById('search-date').value;
      const bandName = document.getElementById('search-band-name').value.trim();
      const btn = document.getElementById('btn-search-booking');
      const resultsContainer = document.getElementById('search-results');

      await withButtonLoading(btn, async () => {
        resultsContainer.innerHTML = '<div style="text-align: center; color: var(--text-sub); padding: 10px;">検索中...</div>';
        const res = await callGasApi('findEvents', { date, bandName });
        
        if (!res.success || !res.events || res.events.length === 0) {
          resultsContainer.innerHTML = '<div style="text-align: center; color: var(--text-sub); padding: 10px;">該当する予約が見つかりません</div>';
          return;
        }

        resultsContainer.innerHTML = res.events.map(ev => `
          <div class="event-card">
            <div>
              <div class="event-title">${escapeHtml(ev.title)}</div>
              <div class="event-time">${escapeHtml(ev.startStr)} (${escapeHtml(ev.duration)}分)</div>
            </div>
            <button type="button" class="btn btn-danger" style="min-height: 36px; padding: 4px 12px; font-size: 0.85rem;" onclick="handleDeleteBooking('${escapeHtml(ev.id)}', this)">削除</button>
          </div>
        `).join('');
      }, '検索中...');
    }

    async function handleDeleteBooking(eventId, buttonEl) {
      if (!confirm('本当にこの予約を削除しますか？')) return;

      await withButtonLoading(buttonEl, async () => {
        const res = await callGasApi('deleteEventById', { eventId });
        if (res.success) {
          showToast('予約を削除しました');
          const card = buttonEl.closest('.event-card');
          if (card) card.remove();
        } else {
          showToast(res.error || '削除に失敗しました', 'error');
        }
      }, '削除中...');
    }
  </script>
</body>
</html>
