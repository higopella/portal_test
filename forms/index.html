<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>申請フォーム - Higo-Pella Portal</title>
  <link rel="stylesheet" href="../src/css/common.css">
  <link rel="stylesheet" href="../src/css/forms.css">
</head>
<body>

  <main class="container">
    <div class="card">
      <h2 class="form-heading">サークル申請フォーム</h2>
      
      <!-- 切り替えタブ -->
      <div class="form-selector">
        <button type="button" class="form-tab-btn active" onclick="switchForm('expense', this)">部費・経費申請</button>
        <button type="button" class="form-tab-btn" onclick="switchForm('equipment', this)">機材借用申請</button>
        <button type="button" class="form-tab-btn" onclick="switchForm('inquiry', this)">意見・問い合わせ</button>
      </div>

      <!-- Google Forms 埋め込み -->
      <div class="iframe-wrapper">
        <iframe id="google-form-iframe" src="https://docs.google.com/forms/d/e/1FAIpQLSeWlJzJjoWAmWohyY4kik12qSl0sBAPzBDBTV9VdUyARYeB7g/viewform?usp=header">読み込み中...</iframe>
      </div>
    </div>
  </main>

  <script src="../src/js/ui.js"></script>
  <script src="../src/js/api.js"></script>
  <script src="../src/js/auth.js"></script>
  <script src="../src/js/menu.js"></script>
  <script src="../src/js/forms.js"></script>
</body>
</html>
