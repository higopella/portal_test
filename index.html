<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ホーム - Higo-Pella Portal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="src/common.css">
  <style>
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      background-color: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary-dark);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    /* 次回の部会表示 */
    .meeting-date {
      font-size: 18px;
      font-weight: bold;
      color: var(--primary-dark);
      background-color: var(--primary-light);
      padding: 12px;
      border-radius: var(--radius);
      text-align: center;
    }
    /* お知らせエリア */
    .notice-list {
      max-height: 350px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
    }
    .notice-item {
      padding: 12px;
      background-color: var(--bg);
      border-radius: var(--radius);
      border-left: 4px solid var(--primary);
    }
    .notice-item.is-pinned {
      border-left-color: var(--primary-dark);
      background-color: var(--primary-light);
    }
    .notice-header {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 4px;
      display: flex;
      gap: 8px;
    }
    .notice-pin-tag {
      font-weight: bold;
      color: var(--primary-dark);
    }
    .notice-body {
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .notice-body .highlight {
      color: var(--primary-dark);
      font-weight: bold;
    }
    /* ログインフォーム */
    .login-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 320px;
      margin: 40px auto;
      text-align: center;
    }
    .input-text {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
      outline: none;
    }
    .input-text:focus {
      border-color: var(--primary);
    }
    .quick-links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }
  </style>
</head>
<body>

  <!-- 未ログイン時の表示 -->
  <div id="login-section" class="container" style="display: none;">
    <div class="card login-box">
      <h2>サークル員ログイン</h2>
      <p style="font-size: 0.85rem; color: var(--text-sub);">パスワードを入力してください</p>
      <form id="form-login" onsubmit="event.preventDefault(); handleLogin();">
        <input type="password" id="input-password" class="input-text" placeholder="パスワード" style="width: 100%; margin-bottom: 12px;" required>
        <button type="submit" id="btn-login" class="btn btn-primary" style="width: 100%;">ログイン</button>
      </form>
    </div>
  </div>

  <!-- ログイン後のメイン画面 -->
  <main id="main-section" class="container" style="display: none;">
    <!-- 次回の部会 -->
    <section class="card">
      <div class="card-title">次回の部会</div>
      <div id="next-meeting-text" class="meeting-date">計算中...</div>
    </section>

    <!-- クイックアクセス -->
    <section class="quick-links">
      <a href="booking/index.html" class="btn btn-primary">練習予約</a>
      <a href="searchYT/index.html" class="btn btn-primary">YouTube検索</a>
      <a href="forms/index.html" class="btn btn-primary">申請フォーム</a>
    </section>

    <!-- お知らせ -->
    <section class="card">
      <div class="card-title">
        <span>お知らせ</span>
        <button type="button" class="btn btn-primary" id="btn-refresh-notice" style="padding: 4px 10px; font-size: 0.8rem;">更新</button>
      </div>
      <div id="notice-container" class="notice-list">
        <div style="text-align: center; color: var(--text-sub); padding: 20px;">読み込み中...</div>
      </div>
    </section>
  </main>

  <script src="src/menu.js"></script>
  <script>
    // 共通ヘッダー・ドロワーの初期化
    initCommonLayout('home');

    // 画面の初期判定
    document.addEventListener('DOMContentLoaded', () => {
      const isLoggedIn = localStorage.getItem(CONFIG.STORAGE_KEYS.IS_LOGGED_IN) === 'true';
      if (isLoggedIn) {
        showMainView();
      } else {
        document.getElementById('login-section').style.display = 'block';
      }

      // お知らせ更新ボタンのイベント
      const refreshBtn = document.getElementById('btn-refresh-notice');
      if (refreshBtn) {
        refreshBtn.addEventListener('click', () => {
          withButtonLoading(refreshBtn, fetchNotices, '更新中');
        });
      }
    });

    /**
     * 一般パスワード認証を実行します。
     */
    async function handleLogin() {
      const passInput = document.getElementById('input-password');
      const btn = document.getElementById('btn-login');
      const password = passInput.value.trim();

      await withButtonLoading(btn, async () => {
        const res = await callGasApi('verifyPassword', { password });
        if (res.success) {
          localStorage.setItem(CONFIG.STORAGE_KEYS.IS_LOGGED_IN, 'true');
          showToast('ログインしました');
          showMainView();
        } else {
          showToast(res.error || 'パスワードが間違っています', 'error');
        }
      }, '認証中...');
    }

    /**
     * ログイン完了後の画面を描画します。
     */
    function showMainView() {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('main-section').style.display = 'flex';
      calcNextMeeting();
      fetchNotices();
    }

    /**
     * 直近の「第2火曜日」を計算して表示します。
     */
    function calcNextMeeting() {
      const today = new Date();
      let targetDate = null;

      for (let monthOffset = 0; monthOffset < 3; monthOffset++) {
        let year = today.getFullYear();
        let month = today.getMonth() + monthOffset;
        let firstDay = new Date(year, month, 1);
        let tuesdayCount = 0;

        for (let day = 1; day <= 31; day++) {
          let checkDate = new Date(year, month, day);
          if (checkDate.getMonth() !== (month % 12)) break;
          if (checkDate.getDay() === 2) { // 2 = 火曜日
            tuesdayCount++;
            if (tuesdayCount === 2) {
              if (checkDate >= new Date(today.getFullYear(), today.getMonth(), today.getDate())) {
                targetDate = checkDate;
                break;
              }
            }
          }
        }
        if (targetDate) break;
      }

      if (targetDate) {
        const str = `${targetDate.getFullYear()}年${targetDate.getMonth() + 1}月${targetDate.getDate()}日 (火) 18:30〜`;
        document.getElementById('next-meeting-text').textContent = str;
      }
    }

    /**
     * お知らせ一覧を取得して画面に描画します（XSS対策・強調記号装飾）。
     */
    async function fetchNotices() {
      const container = document.getElementById('notice-container');
      try {
        const res = await callGasApi('getNotice');
        if (!res.success || !res.notices || res.notices.length === 0) {
          container.innerHTML = '<div style="text-align: center; color: var(--text-sub); padding: 20px;">現在お知らせはありません。</div>';
          return;
        }

        container.innerHTML = res.notices.map(item => {
          // XSS対策：エスケープ後に [[強調]] を水色太字タグに変換
          let safeText = escapeHtml(item.text);
          safeText = safeText.replace(/\[\[(.*?)\]\]/g, '<span class="highlight">$1</span>');

          return `
            <div class="notice-item ${item.isPinned ? 'is-pinned' : ''}">
              <div class="notice-header">
                ${item.isPinned ? '<span class="notice-pin-tag">[固定]</span>' : ''}
                <span>${escapeHtml(item.time)}</span>
              </div>
              <div class="notice-body">${safeText}</div>
            </div>
          `;
        }).join('');
      } catch (e) {
        container.innerHTML = '<div style="text-align: center; color: var(--danger); padding: 20px;">お知らせの取得に失敗しました。</div>';
      }
    }
  </script>
</body>
</html>
