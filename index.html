<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ホーム - Higo-Pella Portal</title>
  <link rel="icon" type="image/png" href="src/icon.png">
  <link rel="apple-touch-icon" href="src/icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="src/css/common.css">
  <link rel="stylesheet" href="src/css/home.css">
  <script id="google-identity-script" src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- ログイン画面 -->
  <div id="login-section" class="container is-hidden">
    <div class="card login-container">
      <div class="login-brand">
        <img src="src/icon.png" alt="Higo-Pella Logo" class="login-logo">
        <div class="login-app-name">Higo-Pella</div>
      </div>
      <div id="google-login-panel">
        <p class="login-description">Googleアカウントでログインしてください</p>
        <div id="google-login-button" class="google-login-button"></div>
      </div>
      <form id="form-school-email" class="is-hidden">
        <p class="login-description">登録確認のため学校メールアドレスを入力してください</p>
        <input type="email" id="input-school-email" class="input-text" placeholder="学校メールアドレス" autocomplete="email" required>
        <button type="submit" id="btn-school-email" class="btn btn-primary full-width">確認コード送信</button>
      </form>
      <form id="form-otp" class="is-hidden">
        <p class="login-description">学校メールに届いた6桁の確認コードを入力してください</p>
        <input type="text" id="input-otp" class="input-text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6桁の確認コード" required>
        <button type="submit" id="btn-otp" class="btn btn-primary full-width">確認</button>
      </form>
    </div>
  </div>

  <!-- ログイン後メイン画面 -->
  <main id="main-section" class="container is-hidden">
    <div class="home-content-grid">
      <section class="card home-notices">
        <div class="card-header">
          <div class="header-left">
            <span class="card-title">お知らせ</span>
            <!-- 次回部会をインライン統合 -->
            <div class="meeting-tag">次回部会: <span id="next-meeting-text">計算中...</span></div>
          </div>
          <button type="button" class="btn btn-primary btn-sm" id="btn-refresh-notice">更新</button>
        </div>
        <div id="notice-container" class="notice-list">
          <div class="notice-message-loading">読み込み中...</div>
        </div>
      </section>

      <section class="card home-calendar">
        <div class="card-header">
          <span class="card-title">今日の予約</span>
          <button type="button" class="btn btn-primary btn-sm" id="btn-refresh-schedule">更新</button>
        </div>
        <div id="home-schedule" class="home-schedule">
          <div class="schedule-message">読み込み中...</div>
        </div>
      </section>
    </div>

    <div class="logout-wrapper">
      <button type="button" class="btn btn-danger logout-button">ログアウト</button>
    </div>
  </main>

  <script src="src/js/ui.js"></script>
  <script src="src/js/api.js"></script>
  <script src="src/js/auth.js"></script>
  <script src="src/js/menu.js"></script>
  <script src="src/js/home.js"></script>
</body>
</html>
