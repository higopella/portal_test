<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ホーム - Higo-Pella Portal</title>
  <link rel="icon" type="image/png" href="src/icon.png">
  <link rel="apple-touch-icon" href="src/icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="src/css/common.css">
  <link rel="stylesheet" href="src/css/home.css">
</head>
<body>

  <!-- ログイン画面 -->
  <div id="login-section" class="container is-hidden">
    <div class="card login-container">
      <div class="login-brand">
        <img src="src/icon.png" alt="Higo-Pella Logo" class="login-logo" onerror="this.style.display='none'">
        <div class="login-app-name">Higo-Pella</div>
      </div>
      <form id="form-login" onsubmit="event.preventDefault(); handleLogin();">
        <input type="password" id="input-password" class="input-text" placeholder="パスワードを入力" required>
        <button type="submit" id="btn-login" class="btn btn-primary full-width">ログイン</button>
      </form>
    </div>
  </div>

  <!-- ログイン後メイン画面 -->
  <main id="main-section" class="container is-hidden">
    <section class="card">
      <div class="card-header">
        <div class="header-left">
          <span class="card-title">お知らせ</span>
          <!-- 次回部会をインライン統合 -->
          <div class="meeting-tag">次回部会: <span id="next-meeting-text">計算中...</span></div>
        </div>
        <button type="button" class="btn btn-primary btn-sm" id="btn-refresh-notice" onclick="refreshNotices()">更新</button>
      </div>
      <div id="notice-container" class="notice-list">
        <div class="notice-message-loading">読み込み中...</div>
      </div>
    </section>

    <div class="logout-wrapper">
      <button type="button" class="btn btn-danger logout-button" onclick="handleLogout()">ログアウト</button>
    </div>
  </main>

  <script src="src/js/ui.js"></script>
  <script src="src/js/api.js"></script>
  <script src="src/js/auth.js"></script>
  <script src="src/js/menu.js"></script>
  <script src="src/js/home.js"></script>
</body>
</html>
