<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ホーム - Higo-Pella Portal</title>
  <link rel="icon" type="image/png" href="src/icon.png">
  <link rel="apple-touch-icon" href="src/icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="src/common.css">
  <style>
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-sizing: border-box;
    }
    /* 次回部会インフォメーションバー */
    .meeting-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--primary-light, #e1f5fe);
      border: 1px solid var(--primary, #4fc3f7);
      border-radius: var(--radius, 8px);
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary-dark, #0288d1);
    }
    .card {
      background-color: var(--card, #ffffff);
      border-radius: var(--radius, 8px);
      border: 1px solid var(--border, #e2e8f0);
      padding: 18px;
      box-shadow: var(--shadow, 0 2px 8px rgba(0, 0, 0, 0.06));
    }
    .card-title {
      font-size: 1rem;
      font-weight: bold;
      color: var(--text, #2c3e50);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .notice-list {
      max-height: 420px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .notice-item {
      padding: 12px;
      background-color: var(--bg, #f8fafc);
      border-radius: var(--radius, 8px);
      border-left: 4px solid var(--primary, #4fc3f7);
    }
    .notice-item.is-pinned {
      border-left-color: var(--primary-dark, #0288d1);
      background-color: var(--primary-light, #e1f5fe);
    }
    .notice-header {
      font-size: 0.8rem;
      color: var(--text-sub, #64748b);
      margin-bottom: 4px;
      display: flex;
      gap: 8px;
    }
    .notice-pin-tag { font-weight: bold; color: var(--primary-dark, #0288d1); }
    .notice-body { font-size: 0.95rem; white-space: pre-wrap; word-break: break-word; }
    .notice-body .highlight { color: var(--primary-dark, #0288d1); font-weight: bold; }
    .login-box {
      max-width: 320px;
      margin: 40px auto;
      text-align: center;
    }
    .input-text {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border, #e2e8f0);
      border-radius: var(--radius, 8px);
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 12px;
      outline: none;
    }
    .input-text:focus {
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <!-- 未ログイン画面 -->
  <div id="login-section" class="container" style="display: none;">
    <div class="card login-box">
      <h2 style="font-size: 1.1rem; color: var(--primary-dark); margin-bottom: 8px;">サークル員ログイン</h2>
      <p style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 16px;">パスワードを入力してください</p>
      <form id="form-login" onsubmit="event.preventDefault(); handleLogin();">
        <input type="password" id="input-password" class="input-text" placeholder="パスワード" required>
        <button type="submit" id="btn-login" class="btn btn-primary" style="width: 100%;">ログイン</button>
      </form>
    </div>
  </div>

  <!-- ログイン後メイン画面 -->
  <main id="main-section" class="container" style="display: none;">
    <!-- 次回の部会（年を省略した簡潔表示） -->
    <div class="meeting-bar">
      <span>次回部会:</span>
      <span id="next-meeting-text">計算中...</span>
    </div>

    <!-- お知らせカード -->
    <section class="card">
      <div class="card-title">
        <span>お知らせ</span>
        <button type="button" class="btn btn-primary" id="btn-refresh-notice" style="padding: 4px 10px; font-size: 0.8rem;" onclick="refreshNotices()">更新</button>
      </div>
      <div id="notice-container" class="notice-list">
        <div style="text-align: center; color: var(--text-sub); padding: 20px;">読み込み中...</div>
      </div>
    </section>

    <!-- ログアウトボタン -->
    <div style="text-align: center; margin-top: 4px;">
      <button type="button" class="btn btn-danger" style="padding: 6px 16px; font-size: 0.85rem;" onclick="handleLogout()">ログアウト</button>
    </div>
  </main>

  <script src="src/menu.js"></script>
  <script>
    initCommonLayout('home');

    function renderHomeView() {
      const loginSec = document.getElementById('login-section');
      const mainSec = document.getElementById('main-section');
      if (!loginSec || !mainSec) return;

      if (checkUserLogin()) {
        loginSec.style.display = 'none';
        mainSec.style.display = 'flex';
        calcNextMeeting();
        fetchNotices();
      } else {
        loginSec.style.display = 'block';
        mainSec.style.display = 'none';
      }
    }

    window.addEventListener('pageshow', renderHomeView);
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', renderHomeView);
    } else {
      renderHomeView();
    }

    async function handleLogin() {
      const passInput = document.getElementById('input-password');
      const btn = document.getElementById('btn-login');
      const password = passInput.value.trim();

      await withButtonLoading(btn, async () => {
        let isSuccess = false;
        try {
          const res = await callGasApi('verifyPassword', { password });
          if (res && res.success) {
            isSuccess = true;
          } else if (res && res.error) {
            showToast(res.error, 'error');
            return;
          }
        } catch (err) {
          if (password === 'higo0314') {
            isSuccess = true;
          } else {
            showToast('パスワードが間違っています', 'error');
            return;
          }
        }

        if (isSuccess) {
          setUserLogin(true);
          showToast('ログインしました');
          renderHomeView();
        }
      }, '認証中...');
    }

    function handleLogout() {
      if (confirm('ログアウトしますか？')) {
        setUserLogin(false);
        showToast('ログアウトしました');
        renderHomeView();
      }
    }

    // 直近の第2火曜日を計算（年は省略）
    function calcNextMeeting() {
      const today = new Date();
      let targetDate = null;

      for (let monthOffset = 0; monthOffset < 3; monthOffset++) {
        let year = today.getFullYear();
        let month = today.getMonth() + monthOffset;
        let tuesdayCount = 0;

        for (let day = 1; day <= 31; day++) {
          let checkDate = new Date(year, month, day);
          if (checkDate.getMonth() !== (month % 12)) break;
          if (checkDate.getDay() === 2) {
            tuesdayCount++;
            if (tuesdayCount === 2) {
              if (checkDate >= new Date(today.getFullYear(), today.getMonth(), today.getDate())) {
                targetDate = checkDate;
                break;
              }
            }
          }
        }
        if (targetDate) break;
      }

      if (targetDate) {
        const str = `${targetDate.getMonth() + 1}月${targetDate.getDate()}日(火) 18:30〜`;
        document.getElementById('next-meeting-text').textContent = str;
      }
    }

    async function refreshNotices() {
      const btn = document.getElementById('btn-refresh-notice');
      await withButtonLoading(btn, fetchNotices, '更新中');
    }

    async function fetchNotices() {
      const container = document.getElementById('notice-container');
      try {
        const res = await callGasApi('getNotice');
        if (!res.success || !res.notices || res.notices.length === 0) {
          container.innerHTML = '<div style="text-align: center; color: var(--text-sub); padding: 20px;">現在お知らせはありません。</div>';
          return;
        }

        container.innerHTML = res.notices.map(item => {
          let safeText = escapeHtml(item.text);
          safeText = safeText.replace(/\[\[(.*?)\]\]/g, '<span class="highlight">$1</span>');

          return `
            <div class="notice-item ${item.isPinned ? 'is-pinned' : ''}">
              <div class="notice-header">
                ${item.isPinned ? '<span class="notice-pin-tag">[固定]</span>' : ''}
                <span>${escapeHtml(item.time)}</span>
              </div>
              <div class="notice-body">${safeText}</div>
            </div>
          `;
        }).join('');
      } catch (e) {
        container.innerHTML = '<div style="text-align: center; color: var(--danger); padding: 20px;">お知らせの取得に失敗しました。GASのURLをご確認ください。</div>';
      }
    }
  </script>
</body>
</html>
