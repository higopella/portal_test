<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ホーム - Higo-Pella Portal</title>
  <link rel="icon" type="image/png" href="src/icon.png">
  <link rel="apple-touch-icon" href="src/icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="src/css/common.css">
  <link rel="stylesheet" href="src/css/calendar.css">
  <link rel="stylesheet" href="src/css/home.css">
  <script id="google-identity-script" src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- ログイン画面 -->
  <div id="login-section" class="container is-hidden">
    <div class="card login-container">
      <div class="login-brand">
        <img src="src/icon.png" alt="Higo-Pella Logo" class="login-logo">
        <div class="login-app-name">Higo-Pella</div>
      </div>
      <div id="google-login-panel">
        <p class="login-description">自分のGoogleアカウントでログインしてください</p>
        <div id="google-login-button" class="google-login-button"></div>
        <a class="signup-link" href="signup/">新規登録</a>
      </div>
    </div>
  </div>

  <!-- ログイン後メイン画面 -->
  <main id="main-section" class="container is-hidden">
    <div class="home-content-grid">
      <section class="card home-notices">
        <div class="card-header">
          <div class="header-left">
            <span class="card-title">お知らせ</span>
            <!-- 次回部会をインライン統合 -->
            <div class="meeting-tag">部会: <span id="next-meeting-text">計算中...</span></div>
          </div>
          <button type="button" class="btn btn-primary btn-sm" id="btn-refresh-notice">更新</button>
        </div>
        <div id="notice-container" class="notice-list">
          <div class="notice-message-loading">読み込み中...</div>
        </div>
      </section>

      <section class="card home-calendar">
        <div class="card-header">
          <span class="card-title">直近の予約</span>
          <button type="button" class="btn btn-primary btn-sm" id="btn-refresh-schedule">更新</button>
        </div>
        <div class="schedule-toolbar">
          <button type="button" class="schedule-today-btn" id="home-schedule-today">今日</button>
          <div class="schedule-navigation">
            <button type="button" class="schedule-nav-btn" id="home-schedule-prev" aria-label="前の期間">‹</button>
            <span id="home-schedule-period-label" class="schedule-period-label"></span>
            <button type="button" class="schedule-nav-btn" id="home-schedule-next" aria-label="次の期間">›</button>
          </div>
        </div>
        <div id="home-schedule" class="home-schedule schedule-calendar">
          <div class="schedule-message">読み込み中...</div>
        </div>
        <nav class="schedule-view-tabs" aria-label="カレンダー表示">
          <button type="button" class="schedule-view-tab" id="home-schedule-view-day" data-schedule-view="day">日</button>
          <button type="button" class="schedule-view-tab active" id="home-schedule-view-week" data-schedule-view="week">週</button>
          <button type="button" class="schedule-view-tab" id="home-schedule-view-month" data-schedule-view="month">月</button>
        </nav>
      </section>
    </div>

  </main>

  <script src="src/js/ui.js"></script>
  <script src="src/js/api.js"></script>
  <script src="src/js/auth.js"></script>
  <script src="src/js/menu.js"></script>
  <script src="src/js/home.js"></script>
</body>
</html>
