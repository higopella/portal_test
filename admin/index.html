<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者画面 - Higo-Pella Portal</title>
  <link rel="stylesheet" href="../src/css/common.css">
  <link rel="stylesheet" href="../src/css/admin.css">
</head>
<body>

  <!-- 1. 管理者ログインフォーム -->
  <div id="admin-login-section" class="container is-hidden">
    <div class="card admin-login-card">
      <h2 class="admin-login-title">管理者ログイン</h2>
      <form id="form-admin-login" onsubmit="event.preventDefault(); handleAdminLogin();">
        <input type="text" id="admin-username" class="input-text admin-login-username" placeholder="ユーザー名" required>
        <input type="password" id="admin-password" class="input-text admin-login-password" placeholder="パスワード" required>
        <button type="submit" id="btn-admin-login" class="btn btn-primary full-width">ログイン</button>
      </form>
    </div>
  </div>

  <!-- 2. 管理者ダッシュボード -->
  <main id="admin-dashboard-section" class="container is-hidden">
    <!-- 概要・アクセス数 -->
    <section class="card dashboard-summary">
      <div>
        <span class="access-label">累計アクセス数</span>
        <div id="stat-access-count" class="access-count">--</div>
      </div>
      <button type="button" class="btn btn-primary" id="btn-refresh-all" onclick="loadDashboardData()">更新</button>
    </section>

    <!-- お知らせ管理 -->
    <section class="card">
      <div class="card-title">お知らせの追加・管理</div>
      <form id="form-add-notice" class="notice-form" onsubmit="event.preventDefault(); handleAddNotice();">
        <div class="highlight-control">
          <button type="button" class="btn btn-primary highlight-button" onclick="insertHighlightTag()">強調(水色)</button>
          <textarea id="notice-text" class="textarea" rows="3" placeholder="お知らせ内容を入力（選択して「強調」を押すと [[文字]] になります）" required></textarea>
        </div>
        <div class="notice-form-row">
          <label class="pin-label">
            <input type="checkbox" id="notice-is-pinned"> 最上部に固定する
          </label>
          <button type="submit" id="btn-submit-notice" class="btn btn-primary">追加</button>
        </div>
      </form>

      <div class="card-title notice-list-heading">投稿済み一覧</div>
      <div id="admin-notice-list">読み込み中...</div>
    </section>

    <!-- 操作ログ（直近50件） -->
    <section class="card">
      <div class="card-title">予約・操作ログ (最新50件)</div>
      <div class="table-responsive">
        <table class="log-table">
          <thead>
            <tr>
              <th>操作日時</th>
              <th>種別</th>
              <th>練習日</th>
              <th>開始</th>
              <th>内容</th>
              <th>分数</th>
              <th>譲り</th>
            </tr>
          </thead>
          <tbody id="log-table-body">
            <tr><td colspan="7" class="table-message">読み込み中...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="../src/js/ui.js"></script>
  <script src="../src/js/api.js"></script>
  <script src="../src/js/auth.js"></script>
  <script src="../src/js/menu.js"></script>
  <script src="../src/js/admin.js"></script>
</body>
</html>
